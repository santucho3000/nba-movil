<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stats NBA">
<meta name="theme-color" content="#09080d">
<link rel="apple-touch-icon" href="icono.png">
<script src="movil.js"></script>
<title>Stats NBA</title>
<script>
  // Estilos y código con la versión que manda app.py (?v=...): así nunca queda una copia vieja en caché.
  (function () {
    var m = location.search.match(/[?&]v=(\d+)/);
    window.__version = m ? m[1] : String(Date.now());
    window.__archivos = ["colores.js", "graficos.js", "glosario.js", "equipos.js", "versus.js", "personal.js", "rachas.js", "cabecera.js", "portada.js", "unidades.js", "senales.js", "partidos.js", "vivo.js", "apostar.js", "pisos.js", "app.js"];
    document.write('<link rel="stylesheet" href="estilo.css?v=' + window.__version + '"><link rel="stylesheet" href="movil.css?v=' + window.__version + '">');
  })();
</script>
</head>
<body>
<div id="app">
  <aside id="lateral">
    <div class="marca"><div class="marca-logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3.2 3.4 3.2 9.4 0 12.8M18.4 5.6c-3.2 3.4-3.2 9.4 0 12.8"/></svg></div><div class="marca-nombre">Stats NBA</div></div>
    <button class="boton-buscar" id="abrir-buscador" title="Buscar jugadores y equipos">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar <span class="atajo">Ctrl K</span>
    </button>
    <nav id="nav"></nav>
    <div class="nav-espacio"></div>
    <nav id="nav-abajo"></nav>
    <div class="estado-act" id="estado-act"><div class="punto"></div><div id="estado-texto">Cargando…</div></div>
  </aside>
  <main id="principal">
    <header id="barra-sup">
      <button class="boton-atras" id="atras" title="Atrás (Alt+←)" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="miga" id="miga"></div>
      <span class="espacio"></span>
      <button class="vivo-chip" id="vivo-chip" hidden title="Ver los partidos en juego"></button>
      <button class="campana" id="pie-glosario" title="Glosario de abreviaturas (tecla ?)" aria-label="Glosario de abreviaturas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>
      <button class="campana" id="campana" title="Alertas" aria-label="Alertas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span id="campana-n"></span></button>
    </header>
    <section id="contenido"></section>
    <div id="glosario" hidden>
      <div class="glosario-cab"><b>Glosario de abreviaturas</b>
        <input class="control" id="glosario-buscar" placeholder="Buscar (por ejemplo: USG, chances, B2B)…" autocomplete="off" spellcheck="false">
        <span class="espacio"></span><button class="boton" id="glosario-cerrar">Cerrar</button></div>
      <div id="glosario-lista"></div>
    </div>
    
  </main>
</div>

<div id="buscador-fondo">
  <div id="buscador" role="dialog" aria-label="Buscar">
    <input id="buscador-entrada" placeholder="Jugador o equipo… (por ejemplo: sha, SGA, Giannis, OKC)" autocomplete="off" spellcheck="false">
    <div id="buscador-resultados"></div>
    <div class="buscador-pie"><span>↑ ↓ para moverse</span><span>Enter para abrir</span><span>Esc para cerrar</span></div>
  </div>
</div>
<div id="aviso"></div>
<script>
  window.__archivos.forEach(function (a) { document.write('<script src="' + a + '?v=' + window.__version + '"><\/script>'); });
</script>
</body>
</html>
