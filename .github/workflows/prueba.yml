name: Prueba de acceso
on:
  workflow_dispatch:
  push:
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Probar
        run: |
          cat > p.py <<'PY'
          import json, urllib.request
          from playwright.sync_api import sync_playwright
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          R = []
          def anotar(nombre, ok, detalle): R.append((nombre, "PASA" if ok else "FALLA", str(detalle)[:160])); print(R[-1], flush=True)
          def directo(nombre, url, clave):
              try:
                  q = urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "https://www.nba.com/", "Origin": "https://www.nba.com", "Accept": "application/json"})
                  t = urllib.request.urlopen(q, timeout=30).read().decode("utf-8", "replace")
                  anotar(nombre, clave in t, f"{len(t)} caracteres")
              except Exception as e: anotar(nombre, False, e)
          directo("ESPN marcador (directo)", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard", '"events"')
          directo("NBA marcador en vivo (directo)", "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json", '"scoreboard"')
          directo("NBA stats (directo)", "https://stats.nba.com/stats/leaguegamelog?Counter=0&Direction=DESC&LeagueID=00&PlayerOrTeam=T&Season=2026-27&SeasonType=Regular%20Season&Sorter=DATE", '"resultSets"')
          FETCH = """async (u) => { try { const c = new AbortController(); setTimeout(() => c.abort(), 40000);
              const r = await fetch(u, {signal: c.signal, headers: {Accept: 'application/json'}}); const t = await r.text(); return [r.status, t.length, t.slice(0, 120)]; }
              catch (e) { return [0, 0, String(e)]; } }"""
          with sync_playwright() as p:
              b = p.chromium.launch(args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(user_agent=UA, locale="es-AR", viewport={"width": 1366, "height": 820})
              pg = ctx.new_page()
              try:
                  r = pg.goto("https://www.nba.com/robots.txt", timeout=60000)
                  anotar("NBA pagina base (navegador)", r.status == 200, r.status)
                  for nombre, url, clave in (
                      ("NBA marcador en vivo (navegador)", "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json", "scoreboard"),
                      ("NBA stats (navegador)", "https://stats.nba.com/stats/leaguegamelog?Counter=0&Direction=DESC&LeagueID=00&PlayerOrTeam=T&Season=2026-27&SeasonType=Regular%20Season&Sorter=DATE", "resultSets")):
                      s = pg.evaluate(FETCH, url)
                      anotar(nombre, s[0] == 200 and s[1] > 500, s)
              except Exception as e: anotar("NBA (navegador)", False, e)
              pg2 = ctx.new_page()
              try:
                  r = pg2.goto("https://pba.stake.bet.ar/deportes/basketball/usa/nba", timeout=60000, wait_until="domcontentloaded")
                  pg2.wait_for_timeout(15000)
                  titulo, largo = pg2.title(), len(pg2.content())
                  trabado = any(x in (titulo + pg2.content()[:3000]).lower() for x in ("just a moment", "un momento", "attention required", "access denied", "verif"))
                  anotar("Stake pagina (navegador)", r.status == 200 and not trabado, f"HTTP {r.status}, titulo '{titulo}', {largo} caracteres")
              except Exception as e: anotar("Stake pagina (navegador)", False, e)
              b.close()
          print("\n===== RESUMEN =====")
          for n, e, d in R: print(f"{e:6} {n}: {d}")
          PY
          python p.py
